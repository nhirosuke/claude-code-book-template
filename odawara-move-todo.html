  function stamp(ms){if(!ms)return '';var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function anchorDate(a){
    var s=state.settings, mv=parse(s.moveDate);
    if(a==='settle')return s.settleDate?parse(s.settleDate):mv-30;
    if(a==='sale')return s.saleDate?parse(s.saleDate):mv+330;
    return mv;
  }
  function dueOf(t){if(t.due)return parse(t.due);return anchorDate(t.anchor||'move')+(t.offset||0)}
  function whoName(w){return w==='a'?state.settings.nameA:w==='b'?state.settings.nameB:'両方'}
  function nameOf(id){if(!id)return '';if(state.names[id])return state.names[id];if(id===state.me.id)return state.me.name||'自分';return ''}

  function write(path,fn){
    var prev=queue[path]||Promise.resolve();
    var next=prev.then(fn).catch(function(e){toast('保存できませんでした。編集権限があるか確認してください。');console.error(e)});
    queue[path]=next;return next;
  }
  function updTodo(id,patch){return write('todos/'+id,function(){return todosCol.doc(id).update(patch)})}
  function updVisit(id,patch){return write('visits/'+id,function(){return visitCol.doc(id).update(patch)})}
  function todoById(id){for(var i=0;i<state.todos.length;i++)if(state.todos[i].id===id)return state.todos[i];return null}
  function visitById(id){for(var i=0;i<state.visits.length;i++)if(state.visits[i].id===id)return state.visits[i];return null}

  /* ---- subtasks: map {id:{text,done,order,by,doneAt,deleted}}; derived from research.steps until first edited ---- */
  function subsOf(t){
    var m=t.subtasks, arr=[];
    if(m&&typeof m==='object'){arr=Object.keys(m).map(function(id){return Object.assign({id:id},m[id])}).filter(function(s){return !s.deleted&&s.text})}
    else if(t.research&&t.research.steps){arr=t.research.steps.map(function(s,i){return {id:'r'+i,text:s,done:false,order:i,derived:true}})}
    return arr.sort(function(a,b){return (a.order||0)-(b.order||0)});
  }
  function fullMap(t){var m={};subsOf(t).forEach(function(s){m[s.id]={text:s.text,done:!!s.done,order:s.order||0}});return m}
  function statusAfter(t,subs){
    var n=subs.length, d=subs.filter(function(s){return s.done}).length;
    if(!n)return null;
    if(d===n)return 'done';
    if(t.status==='done')return d?'doing':'todo';
    if(t.status==='todo'&&d)return 'doing';
    return null;
  }
  function changeSubs(t,mutate,after){
    var patch={subtasks:t.subtasks?{}:fullMap(t)};
    mutate(patch.subtasks);
    var st=statusAfter(t,after);
    if(st&&st!==t.status){patch.status=st;if(st==='done')toast('サブタスクがすべて完了したので、TODOを完了にしました')}
    updTodo(t.id,patch);
  }
  function toggleSub(t,sid,done){
    var after=subsOf(t).map(function(s){return s.id===sid?Object.assign({},s,{done:done}):s});
    changeSubs(t,function(m){m[sid]=Object.assign(m[sid]||{},{done:done,by:done?state.me.id:null,doneAt:done?Date.now():null})},after);
  }
  function addSub(t,text){
    var subs=subsOf(t), max=subs.reduce(function(m,s){return Math.max(m,s.order||0)},0);
    var sid='s'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
    var patch={subtasks:t.subtasks?{}:fullMap(t)};
    patch.subtasks[sid]={text:text,done:false,order:max+1};
    if(t.status==='done')patch.status='doing';
    updTodo(t.id,patch);
  }
  function delSub(t,sid){
    var after=subsOf(t).filter(function(s){return s.id!==sid});
    changeSubs(t,function(m){m[sid]=Object.assign(m[sid]||{},{deleted:true})},after);
  }

  /* ---- prerequisites ---- */
  function pendingPrereqs(t){return (t.after||[]).map(todoById).filter(function(p){return p&&p.status!=='done'})}
  /* ---- window-closed days: Sat/Sun, national holidays (incl. substitute and citizens' holidays), year-end 12/29-1/3 ---- */
  var HCACHE={};
  function nthMon(y,m,n){var f=Date.UTC(y,m-1,1)/86400000, off=(1-wd(f)+7)%7;return f+off+7*(n-1)}
  function holidaysOf(y){
    if(HCACHE[y])return HCACHE[y];
    var D=function(m,d){return Date.UTC(y,m-1,d)/86400000}, h={};
    var sp=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)), au=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
    h[D(1,1)]='元日';h[nthMon(y,1,2)]='成人の日';h[D(2,11)]='建国記念の日';h[D(2,23)]='天皇誕生日';h[D(3,sp)]='春分の日';h[D(4,29)]='昭和の日';
    h[D(5,3)]='憲法記念日';h[D(5,4)]='みどりの日';h[D(5,5)]='こどもの日';h[nthMon(y,7,3)]='海の日';h[D(8,11)]='山の日';h[nthMon(y,9,3)]='敬老の日';
    h[D(9,au)]='秋分の日';h[nthMon(y,10,2)]='スポーツの日';h[D(11,3)]='文化の日';h[D(11,23)]='勤労感謝の日';
    Object.keys(h).map(Number).forEach(function(d){if(wd(d)===0){var n=d+1;while(h[n])n++;h[n]='振替休日'}});
    for(var d=D(1,2);d<D(12,31);d++){if(!h[d]&&wd(d)!==0&&h[d-1]&&h[d+1])h[d]='国民の休日'}
    HCACHE[y]=h;return h;
  }
  function holidayName(d){return holidaysOf(new Date(d*86400000).getUTCFullYear())[d]||''}
  function closedReason(d){
    var w=wd(d); if(w===6)return '土曜'; if(w===0)return '日曜';
    var n=holidayName(d); if(n)return n;
    var x=new Date(d*86400000), m=x.getUTCMonth()+1, day=x.getUTCDate();
    if((m===12&&day>=29)||(m===1&&day<=3))return '年末年始';
    return '';
  }
  function isClosed(d){return !!closedReason(d)}
  function prevOpen(d){var n=0;while(isClosed(d)&&n<14){d--;n++}return d}

  function visible(){
    return state.todos.filter(function(t){
      if(state.view==='open'&&t.status==='done'&&!state.open[t.id])return false;
      if(state.who==='a'&&t.who==='b')return false;
      if(state.who==='b'&&t.who==='a')return false;
      if(state.who==='both'&&t.who!=='both')return false;
      if(state.cat!=='all'&&t.cat!==state.cat)return false;
      return true;
    });
  }
  function chipWho(w){return '<span class="chip '+w+'">'+esc(whoName(w))+'</span>'}
  function pendingFor(id){return state.requests.filter(function(r){return r.status==='pending'&&r.todoId===id}).length}
  function srcChip(r){
    if(r.src==='official')return '<span class="chip src-official">公式情報あり</span>';
    if(r.src==='partial')return '<span class="chip src-partial">一部のみ確認</span>';
    return '<span class="chip">一般情報(要確認)</span>';
  }

  /* ---- Claude panel ---- */
  function chatOf(key){return state.chats[key]||(state.chats[key]={turns:[],live:'',busy:false,err:'',ctl:null})}
  function panelHTML(key){
    var chat=chatOf(key), draft=state.drafts[key]||'';
    var reqs=state.requests.filter(function(r){return key==='g'?!r.todoId:r.todoId===key}).sort(function(a,b){return (b.at||0)-(a.at||0)});
    var h='<div class="claude" data-key="'+esc(key)+'"><h3>Claudeに相談・依頼</h3><div class="quick">'

      +'<textarea class="ctext" placeholder="例: 小田原市の最新の申込期間を調べて / この手順で足りない点はある?">'+esc(draft)+'</textarea>'
      +'<div class="edit"><button type="button" class="btn primary small" data-act="ask"'+(chat.busy||!sample?' disabled':'')+'>すぐに聞く</button>'
      +'<button type="button" class="btn small" data-act="req">調べてもらう(依頼)</button>'
      +(chat.busy?'<button type="button" class="btn small" data-act="stop">停止</button>':'')
      +(chat.turns.length&&!chat.busy?'<button type="button" class="btn small" data-act="reset">会話をリセット</button>':'')+'</div>'
      +'<p class="hint">「すぐに聞く」はWebを検索せず、この画面の情報と一般知識で答えます(あなたのClaude利用枠を使います)。最新の制度・期限・金額の調査や、サブタスクの追加は「調べてもらう」で依頼してください。'+(sample?'':'(この環境では「すぐに聞く」は使えません)')+'</p>';
    chat.turns.forEach(function(t,i){
      h+='<div class="bub '+(t.role==='user'?'u':'c')+'"><small>'+(t.role==='user'?'あなた':'Claude(Web検索なし・要確認)')+'</small>'+esc(t.content)+'</div>';
      if(t.role==='assistant'&&key!=='g'&&i===chat.turns.length-1&&!chat.busy)h+='<div class="edit"><button type="button" class="btn small" data-act="append">この回答をメモに追記</button></div>';
    });
    if(chat.busy)h+='<div class="bub c live" data-live="'+esc(key)+'"><small>Claude</small>'+(chat.live?esc(chat.live):'考え中…')+'</div>';
    if(chat.err)h+='<p class="caution">'+esc(chat.err)+'</p>';
    if(reqs.length){
      h+='<h3 style="margin-top:4px">依頼と回答</h3>'+reqs.map(function(r){
        var done=r.status==='done';
        return '<div class="req"><div class="meta"><span class="chip '+(done?'ok':'warn')+'">'+(done?'回答済み':'依頼中')+'</span><span class="chip">'+esc(nameOf(r.by)||'')+' '+esc(stamp(r.at))+'</span></div>'
          +'<div class="q">'+esc(r.text)+'</div>'
          +(done&&r.reply?'<div class="a">'+esc(r.reply)+'<small style="display:block;color:var(--muted)">Claude '+esc(stamp(r.repliedAt))+'</small></div>':'')
          +(!done?'<small class="hint">Claudeのセッションで「依頼を処理して」と伝えると、回答がここに入ります。</small>':'')+'</div>';
      }).join('');
    }
    return h+'</div>';
  }
  function contextFor(key){
    var s=state.settings;
    var base='あなたは、夫婦の引っ越しTODOを手伝うアシスタントです。前提: 兵庫県宝塚市の持ち家を売却し、神奈川県小田原市(酒匂1丁目周辺などが候補)の持ち家を購入する県外転居。りそな銀行の住みかえプラン(先行購入、旧居の売却に約1年の猶予を予定)。引っ越し予定日は'+s.moveDate+(s.moveDateTentative?'(仮)':'')+'、新居の決済日は'+fmt(anchorDate('settle'))+'ごろ。夫婦とも在宅勤務で、子どもが1人'+(s.childBirth?'(生年月日'+s.childBirth+')':'(3歳)')+'。車・バイクあり。ペットはいない。夫婦2人で使う。\n'
      +'ルール: 日本語で、短く具体的に答える。あなたはWebを検索できないので、制度・期限・金額は断定せず、確認先(公式サイトや窓口)を示す。調査が必要な内容は、画面の「調べてもらう(依頼)」を使うよう案内する。\n';
    if(key==='g'){
      var td=today();
      var lines=state.todos.filter(function(t){return t.status!=='done'}).sort(function(a,b){return dueOf(a)-dueOf(b)}).slice(0,70).map(function(t){var sb=subsOf(t);return '- '+jp(dueOf(t))+' '+whoName(t.who)+' '+t.title+(sb.length?' ('+sb.filter(function(x){return x.done}).length+'/'+sb.length+')':'')});
      return base+'今日は'+fmt(td)+'。未完了のTODO(期限順):\n'+lines.join('\n');
    }
    var t=todoById(key); if(!t)return base;
    var info={title:t.title,category:t.cat,assignee:whoName(t.who),due:fmt(dueOf(t)),status:t.status,deadlineRule:t.legal||'',note:t.note||'',subtasks:subsOf(t).map(function(x){return (x.done?'[x] ':'[ ] ')+x.text}),research:t.research||null};
    return base+'質問の対象のTODO(JSON):\n'+JSON.stringify(info).slice(0,9000);
  }
  function ask(key){
    var chat=chatOf(key), text=(state.drafts[key]||'').trim();
    if(!text||chat.busy)return;
    if(!sample){toast('この環境では「すぐに聞く」を使えません');return}
    chat.turns.push({role:'user',content:text}); chat.busy=true; chat.live=''; chat.err=''; state.drafts[key]='';
    var ctl=new AbortController(); chat.ctl=ctl;
    var input=[{role:'user',content:contextFor(key)}].concat(chat.turns.slice(-8));
    render();
    sample(input,{cache:false,signal:ctl.signal,onText:function(u){
      chat.live=u.text;
      var el=document.querySelector('[data-live="'+key+'"]');
      if(el){el.innerHTML='<small>Claude</small>';el.appendChild(document.createTextNode(u.text))}
    }}).then(function(r){
      chat.turns.push({role:'assistant',content:r.text+(r.truncated?'\n(長いため途中で切れました)':'')});
    }).catch(function(e){
      if(e&&e.text)chat.turns.push({role:'assistant',content:e.text+'\n(途中で止まりました)'});
      if(!e||e.code!=='cancelled')chat.err=CERR[e&&e.code]||'回答を取得できませんでした。もう一度お試しください。';
    }).then(function(){chat.busy=false;chat.live='';chat.ctl=null;render()});
  }
  function request(key,textOverride){
    var text=(textOverride||state.drafts[key]||'').trim(); if(!text)return;
    if(!textOverride)state.drafts[key]='';
    var data={todoId:key==='g'?null:key,text:text,by:state.me.id,at:Date.now(),status:'pending',reply:'',repliedAt:null};
    write('requests/new',function(){return reqCol.add(data)}).then(function(){toast('依頼を保存しました。Claudeのセッションで「依頼を処理して」と伝えてください')});
    render();
  }

  function renderBalance(td){
    var open=state.todos.filter(function(t){return t.status!=='done'});
    var rows=['a','b','both'].map(function(w){
      var mine=open.filter(function(t){return t.who===w});
      var soon=mine.filter(function(t){return dueOf(t)<=td+30}).length;
      return {w:w,n:mine.length,soon:soon};

    });

  function csvEsc(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'}
  function usDate(d){var p=fmt(d).split('-');return p[1]+'/'+p[2]+'/'+p[0]}
  function t12(hhmm,plus){var h=+hhmm.slice(0,2)+(plus||0), m=hhmm.slice(3,5), ap=h%24>=12?'PM':'AM', hh=(h%24)%12||12;return hh+':'+m+' '+ap}
  function exportCsv(){
    if(!downloads){toast('この環境では保存できません');return}
    var rows=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location']];
    state.todos.filter(function(t){return t.status!=='done'}).sort(function(a,b){return dueOf(a)-dueOf(b)}).forEach(function(t){
      var d=dueOf(t);
      rows.push(['【'+whoName(t.who)+'】'+t.title,usDate(d),'',usDate(d),'','True',[t.cat,t.legal?'期限ルール: '+t.legal:'',(t.research&&t.research.summary)||''].filter(Boolean).join(' / '),'']);
    });
    state.visits.forEach(function(v){
      var d=visitDay(v); if(d==null||v.status==='済')return;

      rows.push(['【見学】'+v.title,usDate(d),tm?t12(tm,0):'',usDate(d),tm?t12(tm,1):'',tm?'False':'True',v.notes||'',v.org||'']);

  function vsort(a,b){
    var da=a.confirmedAt?parse(a.confirmedAt):((a.options&&a.options[0])?parse(a.options[0].at):9e9);
    var db_=b.confirmedAt?parse(b.confirmedAt):((b.options&&b.options[0])?parse(b.options[0].at):9e9);
    return da-db_||(a.order||0)-(b.order||0);
  }
  function optsOf(v){

      +'<label>2人目の呼び名<input type="text" id="sB" value="'+esc(s.nameB)+'" size="8"></label>'
      +'<button type="button" class="btn primary" id="sSave" style="align-self:flex-end">保存</button></div>'
      +'<p class="route" style="margin-top:8px">各TODOの期限は、基準日(引っ越し日・決済日・売却完了日)からの日数で決まります。決済日や売却完了日が決まったら入力すると、関連するTODOの期限がまとめて動きます。日付を固定したTODOは動きません。</p>';
  }

  function render(){
    if(!state.ready)return;
    if(inField()){pendingRender=true;return}
    pendingRender=false;
    var td=today();
    renderHeader(td);
    if(state.tab==='todo')renderTodoTab(td);
    else if(state.tab==='docs')renderDocs();
    else if(state.tab==='cal')renderCal(td);
    else if(state.tab==='visit')renderVisit();
  }

  /* ---- events ---- */
  function goTodo(id){
    state.tab='todo';state.open[id]=true;state.view='all';state.who='all';state.cat='all';render();
    setTimeout(function(){var el=document.querySelector('.item[data-id="'+id+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'})},30);
  }
  function claudeClick(e){
    var panel=e.target.closest('.claude'); if(!panel)return false;
    var b=e.target.closest('[data-act]'); if(!b)return true;
    var key=panel.getAttribute('data-key'), a=b.getAttribute('data-act');
    if(a==='quick'){var q=b.getAttribute('data-text');var cur=state.drafts[key]||'';state.drafts[key]=cur?cur+'\n'+q:q;pendingRender=false;render()}
    else if(a==='ask'){state.drafts[key]=panel.querySelector('.ctext').value;ask(key)}
    else if(a==='req'){state.drafts[key]=panel.querySelector('.ctext').value;request(key)}
    else if(a==='stop'){var c=chatOf(key);if(c.ctl)c.ctl.abort()}
    else if(a==='reset'){delete state.chats[key];render()}
    else if(a==='append'){
      var t=todoById(key), c2=chatOf(key), last=c2.turns[c2.turns.length-1];
      if(t&&last&&last.role==='assistant'){updTodo(key,{note:(t.note?t.note+'\n\n':'')+'[Claude '+stamp(Date.now())+']\n'+last.content});toast('メモに追記しました')}
    }
    return true;
  }
  function onClick(e){
    if(claudeClick(e))return;
    var act=e.target.closest('[data-act]'); if(!act)return;
    var a=act.getAttribute('data-act');
    if(a==='gtoggle'){state.gopen=!state.gopen;render();return}
    if(a==='gotodo'||a==='gopre'){goTodo(act.getAttribute('data-pid'));return}
    if(a==='csv'){exportCsv();return}
    if(a==='vsync'){request('g','候補比較ツール('+CAND_URL+')の物件のうち、状態が「内見予定」「内見済み」のものと、その「次のアクション」を読み取り、このページの「見学」タブの予定に取り込んで更新してください。');return}
    var vc=e.target.closest('.vcard');
    if(vc){
      var vid=vc.getAttribute('data-vid'), v=visitById(vid);
      if(a==='vdel'){
        if(state.vconfirm===vid){state.vconfirm=null;write('visits/'+vid,function(){return visitCol.doc(vid).delete()})}
        else{state.vconfirm=vid;render()}
      }else if(a==='vpick'&&v){
        var o=optsOf(v)[+act.getAttribute('data-oi')];
        if(o)updVisit(vid,{confirmedAt:o.at,status:'確定'});
      }
      return;
    }
    var item=e.target.closest('.item'); if(!item)return;
    var id=item.getAttribute('data-id'), t=todoById(id);
    if(a==='open'){state.open[id]=!state.open[id];state.confirmDel=null;render()}
    else if(a==='unfix'){updTodo(id,{due:null})}
    else if(a==='del'){
      if(state.confirmDel===id){state.confirmDel=null;write('todos/'+id,function(){return todosCol.doc(id).delete()})}
      else{state.confirmDel=id;render()}
    }else if(a==='subadd'&&t){var inp=item.querySelector('.subnew'), val=inp.value.trim();if(val){inp.value='';addSub(t,val)}}
    else if(a==='subdel'&&t){delSub(t,act.closest('.sub').getAttribute('data-sid'))}
  }
  ['list','gpanel','tabDocs','tabCal','tabVisit'].forEach(function(id){$(id).addEventListener('click',onClick)});
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.tab=b.getAttribute('data-tab');try{localStorage.setItem('mv-tab',state.tab)}catch(_){}render()});
  $('list').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.classList.contains('subnew')){
      e.preventDefault();var item=e.target.closest('.item'),t=todoById(item.getAttribute('data-id')),v=e.target.value.trim();
      if(t&&v){e.target.value='';addSub(t,v)}
    }
  });
  function onInput(e){
    if(!e.target.classList.contains('ctext'))return;
    var p=e.target.closest('.claude'); if(p)state.drafts[p.getAttribute('data-key')]=e.target.value;
  }
  $('list').addEventListener('input',onInput);
  $('gpanel').addEventListener('input',onInput);
  function numOrNull(v){return v===''?null:Math.max(0,Number(v)||0)}
  $('list').addEventListener('change',function(e){
    var item=e.target.closest('.item'); if(!item)return;
    var id=item.getAttribute('data-id'), a=e.target.getAttribute('data-act'), v=e.target.value, t=todoById(id);
    if(a==='toggle'){
      if(e.target.checked&&t&&pendingPrereqs(t).length)toast('先に終えるTODOが残っています(完了にはしました)');
      updTodo(id,{status:e.target.checked?'done':'todo'});
    }
    else if(a==='who')updTodo(id,{who:v});
    else if(a==='status')updTodo(id,{status:v});
    else if(a==='due'){if(v)updTodo(id,{due:v})}
    else if(a==='anchor')updTodo(id,{anchor:v,due:null});
    else if(a==='offset'){if(v!=='')updTodo(id,{offset:Number(v),due:null})}
    else if(a==='estimate')updTodo(id,{estimate:numOrNull(v)});
    else if(a==='note')updTodo(id,{note:v});
    else if(a==='subtoggle'&&t)toggleSub(t,e.target.closest('.sub').getAttribute('data-sid'),e.target.checked);
  });
  $('tabDocs').addEventListener('change',function(e){
    var a=e.target.getAttribute('data-act');
    if(a==='doctoggle'){
      var k=e.target.closest('.dline').getAttribute('data-dk'), patch={};
      patch[k]={done:e.target.checked,by:state.me.id,at:Date.now()};
      write('settings/docs',function(){return docsDoc.get().then(function(s){return s.exists?docsDoc.update(patch):docsDoc.set(patch)})});
    }else if(a==='estimate'||a==='actual'){
      var id=e.target.closest('.costrow').getAttribute('data-id'), p={};p[a]=numOrNull(e.target.value);updTodo(id,p);
    }
  });
  $('tabVisit').addEventListener('change',function(e){
    var vc=e.target.closest('.vcard'); if(!vc)return;
    var vid=vc.getAttribute('data-vid'), v=visitById(vid), a=e.target.getAttribute('data-vact'), val=e.target.value; if(!v)return;
    if(a==='status')updVisit(vid,{status:val});
    else if(a==='notes')updVisit(vid,{notes:val});
    else if(a==='date'||a==='time'){
      var d=a==='date'?val:(v.confirmedAt?v.confirmedAt.slice(0,10):''), tm=a==='time'?val:timeOf(v);
      if(!d){updVisit(vid,{confirmedAt:''});return}
      updVisit(vid,{confirmedAt:tm?d+'T'+tm:d});
    }
  });
  $('tabVisit').addEventListener('click',function(e){
    var b=e.target.closest('[data-vf]'); if(b){state.vfilter=b.getAttribute('data-vf');render()}
  });
  $('tabVisit').addEventListener('input',function(e){
    var id=e.target.id; if(id==='vnTitle')state.vnew.title=e.target.value;else if(id==='vnOrg')state.vnew.org=e.target.value;else if(id==='vnDate')state.vnew.date=e.target.value;else if(id==='vnTime')state.vnew.time=e.target.value;
  });
  $('tabVisit').addEventListener('change',function(e){if(e.target.id==='vnKind')state.vnew.kind=e.target.value});
  $('tabVisit').addEventListener('submit',function(e){
    e.preventDefault();
    var n=state.vnew; if(!n.title.trim())return;
    var max=state.visits.reduce(function(m,v){return Math.max(m,v.order||0)},0);
    var data={kind:n.kind,title:n.title.trim(),org:n.org.trim(),status:n.date?'確定':'調整中',confirmedAt:n.date?(n.time?n.date+'T'+n.time:n.date):'',options:[],candId:'',link:'',notes:'',order:max+1};
    state.vnew={kind:n.kind,title:'',org:'',date:'',time:''};
    write('visits/new',function(){return visitCol.add(data)}).then(function(){toast('追加しました')});
  });
  function flush(){setTimeout(function(){if(pendingRender)render()},50)}
  ['list','gpanel','tabDocs','tabVisit'].forEach(function(id){$(id).addEventListener('focusout',flush)});
  $('whoSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.who=b.getAttribute('data-w');render()});
  $('viewSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.view=b.getAttribute('data-v');render()});
  $('catSel').addEventListener('change',function(e){state.cat=e.target.value;render()});
  $('settingsBtn').addEventListener('click',function(){state.editingSettings=!state.editingSettings;renderSettings()});
  $('settings').addEventListener('click',function(e){
    if(e.target.id!=='sSave')return;
    var m=$('sMove').value; if(!m){toast('引っ越し日を入力してください');return}
    var s={moveDate:m,moveDateTentative:$('sTent').value==='1',settleDate:$('sSettle').value||null,saleDate:$('sSale').value||null,childBirth:$('sChild').value||'',nameA:$('sA').value.trim()||'夫',nameB:$('sB').value.trim()||'妻'};
    write('settings/main',function(){return settingsDoc.set(s)}).then(function(){state.editingSettings=false;renderSettings();toast('保存しました')});
  });
  $('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var title=$('addTitle').value.trim(); if(!title)return;
    var due=$('addDue').value||null;
    var max=state.todos.reduce(function(m,t){return Math.max(m,t.order||0)},0);
    var data={title:title,cat:$('addCat').value,who:$('addWho').value,anchor:'move',offset:due?null:-30,due:due,priority:false,status:'todo',note:'',research:null,order:max+1};
    write('todos/new',function(){return todosCol.add(data)}).then(function(){$('addTitle').value='';$('addDue').value='';toast('追加しました')});
  });
  $('addCat').innerHTML=CATS.map(function(c){return '<option>'+esc(c)+'</option>'}).join('');

  function resolveNames(){
    if(!userCap||!userCap.profiles)return;
    var ids={};
    state.todos.forEach(function(t){var m=t.subtasks;if(m)Object.keys(m).forEach(function(k){if(m[k]&&m[k].by)ids[m[k].by]=1})});
    state.requests.forEach(function(r){if(r.by)ids[r.by]=1});
    var list=Object.keys(ids).filter(function(i){return !state.names[i]});
    var key=list.join(',');
    if(!list.length||key===nameKey)return;
    nameKey=key;
    userCap.profiles(list).then(function(ps){
      var changed=false;
      list.forEach(function(i){if(ps[i]&&ps[i].name&&state.names[i]!==ps[i].name){state.names[i]=ps[i].name;changed=true}});
      if(changed)render();
    }).catch(function(){});
  }

  function boot(){
    try{var tb=localStorage.getItem('mv-tab');if(tb&&/^(todo|docs|cal|visit)$/.test(tb))state.tab=tb}catch(_){}
    if(!window.claude||!claude.use){$('list').innerHTML='<div class="empty">共有データを読み込めません。claude.aiで開き直してください。</div>';return}
    claude.use('user').then(function(u){
      userCap=u;
      if(u&&u.me)return u.me().then(function(m){state.me={id:m.id,name:m.name||''}});
    }).catch(function(){}).then(function(){return claude.use('sample')}).then(function(s){sample=s||null;render()}).catch(function(){});
    claude.use('downloads').then(function(d){downloads=d||null;render()}).catch(function(){});
    claude.use('db').then(function(d){
      if(!d){$('list').innerHTML='<div class="empty">共有データを読み込めません。サインインしてから開き直してください。</div>';return}
      db=d; todosCol=db.collection('todos'); reqCol=db.collection('requests'); visitCol=db.collection('visits'); settingsDoc=db.doc('settings/main'); docsDoc=db.doc('settings/docs');
      settingsDoc.onSnapshot(function(snap){
        if(snap.exists){var s=snap.data();state.settings={moveDate:s.moveDate||'2027-03-20',moveDateTentative:!!s.moveDateTentative,settleDate:s.settleDate||null,saleDate:s.saleDate||null,childBirth:s.childBirth||'',nameA:s.nameA||'夫',nameB:s.nameB||'妻'}}
        state.ready=true; render(); renderSettings();
      },function(){});
      docsDoc.onSnapshot(function(snap){state.docsDone=snap.exists?snap.data():{};render()},function(){});
      todosCol.onSnapshot(function(snap){
        state.todos=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
        state.ready=true; render(); resolveNames();
      },function(){$('list').innerHTML='<div class="empty">読み込みに失敗しました。ページを開き直してください。</div>'});
      reqCol.onSnapshot(function(snap){state.requests=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});render();resolveNames()},function(){});
      visitCol.onSnapshot(function(snap){state.visits=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});render()},function(){});
    });
  }
  boot();
})();
</script>
