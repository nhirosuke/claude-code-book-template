<style>
/* Layout: 1-column phone-first list. Summary strip on top, filters, then due-date groups of expandable rows. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eff1; --ink:#13232b; --muted:#5b6f78; --line:#d5dfe3;
  --accent:#0d6b7a; --accent-ink:#ffffff; --accent-soft:#d9eef1;
  --a:#2a5ba8; --a-soft:#dfe9f8; --b:#a8426b; --b-soft:#f7e1ea; --both:#4d5f69; --both-soft:#e4eaed;
  --ok:#1f7a4a; --ok-soft:#dcf1e5; --warn:#8a5a00; --warn-soft:#fbeccc; --bad:#b3261e; --bad-soft:#fbe0dd;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --display:"Zen Maru Gothic","Zen Kaku Gothic New","Hiragino Maru Gothic ProN",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a20; --surface:#17262e; --surface2:#1f323c; --ink:#e6eef1; --muted:#97aab3; --line:#2b414c;
  --accent:#4fc0d1; --accent-ink:#06222a; --accent-soft:#17383f;
  --a:#8db4ee; --a-soft:#1d3050; --b:#ef9bb9; --b-soft:#4a2335; --both:#a9bcc5; --both-soft:#26363e;
  --ok:#68d09a; --ok-soft:#173a29; --warn:#f0c15f; --warn-soft:#41330f; --bad:#ff8f86; --bad-soft:#4a1e1b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#17262e; --surface2:#1f323c; --ink:#e6eef1; --muted:#97aab3; --line:#2b414c;
  --accent:#4fc0d1; --accent-ink:#06222a; --accent-soft:#17383f;
  --a:#8db4ee; --a-soft:#1d3050; --b:#ef9bb9; --b-soft:#4a2335; --both:#a9bcc5; --both-soft:#26363e;
  --ok:#68d09a; --ok-soft:#173a29; --warn:#f0c15f; --warn-soft:#41330f; --bad:#ff8f86; --bad-soft:#4a1e1b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-family:var(--display);font-size:24px;line-height:1.25;margin:0;text-wrap:balance}
.route{color:var(--muted);font-size:13px;margin:2px 0 0}
.count{text-align:right}
.count b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.count span{font-size:13px;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:36px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:30px;padding:3px 10px;font-size:13px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;min-height:36px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
select,input[type=text],input[type=date],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:64px}
.grp h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;display:flex;gap:8px;align-items:center}
.grp h2 em{font-style:normal;background:var(--surface2);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.grp.over h2{color:var(--bad)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
.item.over{border-color:var(--bad)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;align-items:start}
.chk{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.main{min-width:0;text-align:left;background:none;border:0;padding:0;width:100%}
.title{display:block;font-weight:500;overflow-wrap:anywhere}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;border-radius:99px;padding:1px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.a{background:var(--a-soft);color:var(--a)}
.chip.b{background:var(--b-soft);color:var(--b)}
.chip.both{background:var(--both-soft);color:var(--both)}
.chip.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.pri{background:var(--accent);color:var(--accent-ink);font-weight:700}
.detail{border-top:1px solid var(--line);padding:12px 12px 14px 44px;display:grid;gap:12px;background:var(--bg)}
.edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edit label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.research{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:14px}
.research h3{margin:0;font-size:12px;color:var(--accent);letter-spacing:.06em}
.research p{margin:0}
.research ol,.research ul{margin:0;padding-left:20px;display:grid;gap:2px}
.research dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.research dt{color:var(--muted)}
.research dd{margin:0}
.caution{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:6px 10px}
.pending{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.add{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:24px;display:grid;gap:10px}
.add h2{margin:0;font-size:15px}
.add .edit input[type=text]{flex:1 1 220px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:10px}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:5;max-width:calc(100% - 32px)}

.summary{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:480px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat.ask b{color:var(--accent)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.subs{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.subs h3,.claude h3{margin:0;font-size:12px;letter-spacing:.06em;color:var(--accent);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subs h3 .bar{flex:1 1 80px;margin:0;min-width:60px}
.sub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start}
.sub input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.sub .txt{overflow-wrap:anywhere}
.sub.done .txt{text-decoration:line-through;color:var(--muted)}
.sub small{display:block;color:var(--muted);font-size:11px}
.sub .x{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px;min-height:28px}
.sub .x:hover{color:var(--bad);background:var(--bad-soft)}
.subadd{display:flex;gap:8px}
.subadd input{flex:1 1 160px;min-width:0}
.claude{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.claude .quick{display:flex;flex-wrap:wrap;gap:6px}
.claude .quick button{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:2px 10px;font-size:12px;min-height:26px}
.claude .quick button:hover{background:var(--accent-soft)}
.hint{margin:0;font-size:12px;color:var(--muted)}
.bub{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px;padding:8px 10px;font-size:14px}
.bub.u{background:var(--accent-soft)}
.bub.c{background:var(--surface2)}
.bub small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.req{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;font-size:14px}
.req .q{white-space:pre-wrap;overflow-wrap:anywhere}
.req .a{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--ok-soft);border-radius:6px;padding:6px 8px}
.gbox{margin-bottom:12px;display:grid;gap:8px}
@media (prefers-reduced-motion:no-preference){.bub.c.live{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.7}}
a{color:var(--accent)}
@media (max-width:480px){.detail{padding-left:12px}.summary{gap:6px}.stat{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>小田原引っ越しTODO</h1>
      <p class="route">宝塚 → 小田原 / 夫婦で共有</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div id="settings" class="settings" hidden></div>
  <div class="summary" id="summary"></div>
  <div id="banner"></div>
  <div class="gbox" id="gpanel"></div>

  <div class="tools">
    <div class="seg" id="whoSeg" role="group" aria-label="担当で絞り込み"></div>
    <select id="catSel" aria-label="カテゴリで絞り込み"></select>
    <div class="seg" id="viewSeg" role="group" aria-label="表示切替">
      <button type="button" data-v="open" aria-pressed="true">未完了</button>
      <button type="button" data-v="all" aria-pressed="false">すべて</button>
    </div>
    <button class="btn small" id="settingsBtn" type="button">設定</button>
  </div>

  <div id="list"></div>

  <form class="add" id="addForm" autocomplete="off">
    <h2>TODOを追加</h2>
    <div class="edit">
      <input type="text" id="addTitle" placeholder="やること" required aria-label="やること">
    </div>
    <div class="edit">
      <label>カテゴリ<select id="addCat"></select></label>
      <label>担当<select id="addWho"></select></label>
      <label>期限<input type="date" id="addDue"></label>
      <button class="btn primary" type="submit" style="align-self:flex-end">追加</button>
    </div>
  </form>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
  var CATS=['ローン・売却','購入(小田原)','役所','子ども','ペット','車・バイク','ライフライン','引っ越し作業','住所変更・その他'];
  var QUICK=['最新の情報を調べ直して','必要書類を具体的に','費用の目安を調べて','サブタスクを追加して','期限を見直して'];
  var CERR={not_granted:'Claudeの利用が許可されていません。許可のダイアログで許可すると使えます。',sampling_disabled:'このアカウントではClaudeへの質問を使えません。「調べてもらう」で依頼してください。',rate_limited:'回数の上限に達しました。しばらくしてからもう一度お試しください。',session_expired:'ログインの有効期限が切れました。開き直してください。',prompt_too_large:'入力が長すぎます。会話をリセットしてください。',refused:'この内容には回答できませんでした。言い方を変えてください。',empty_completion:'回答が空でした。質問を具体的にしてください。'};
  var state={todos:[],requests:[],settings:{moveDate:'2027-03-20',moveDateTentative:true,nameA:'夫',nameB:'妻'},who:'all',cat:'all',view:'open',open:{},ready:false,editingSettings:false,
    me:{id:null,name:''},names:{},chats:{},drafts:{},gopen:false,confirmDel:null};
  var db=null, todosCol=null, reqCol=null, settingsDoc=null, sample=null, userCap=null, queue={}, pendingRender=false, nameKey='';

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3000)}

  /* dates: UTC-midnight day numbers so timezones never shift a deadline */
  function parse(s){var p=String(s).split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000}
  function fmt(d){var x=new Date(d*86400000);return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')+'-'+String(x.getUTCDate()).padStart(2,'0')}
  function jp(d){var x=new Date(d*86400000);var w='日月火水木金土'[x.getUTCDay()];return (x.getUTCMonth()+1)+'/'+x.getUTCDate()+'('+w+')'}
  function today(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/86400000}
  function stamp(ms){if(!ms)return '';var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function dueOf(t){if(t.due)return parse(t.due);return parse(state.settings.moveDate)+(t.offset||0)}
  function whoName(w){return w==='a'?state.settings.nameA:w==='b'?state.settings.nameB:'両方'}
  function nameOf(id){if(!id)return '';if(state.names[id])return state.names[id];if(id===state.me.id)return state.me.name||'自分';return ''}

  function write(path,fn){
    var prev=queue[path]||Promise.resolve();
    var next=prev.then(fn).catch(function(e){toast('保存できませんでした。編集権限があるか確認してください。');console.error(e)});
    queue[path]=next;return next;
  }
  function updTodo(id,patch){return write('todos/'+id,function(){return todosCol.doc(id).update(patch)})}
  function todoById(id){for(var i=0;i<state.todos.length;i++)if(state.todos[i].id===id)return state.todos[i];return null}

  /* ---- subtasks: map {id:{text,done,order,by,doneAt,deleted}}; before the first edit they are derived from research.steps ---- */
  function subsOf(t){
    var m=t.subtasks, arr=[];
    if(m&&typeof m==='object'){
      arr=Object.keys(m).map(function(id){return Object.assign({id:id},m[id])}).filter(function(s){return !s.deleted&&s.text});
    }else if(t.research&&t.research.steps){
      arr=t.research.steps.map(function(s,i){return {id:'r'+i,text:s,done:false,order:i,derived:true}});
    }
    return arr.sort(function(a,b){return (a.order||0)-(b.order||0)});
  }
  function fullMap(t){var m={};subsOf(t).forEach(function(s){m[s.id]={text:s.text,done:!!s.done,order:s.order||0}});return m}
  function statusAfter(t,subs){
    var n=subs.length, d=subs.filter(function(s){return s.done}).length;
    if(!n)return null;
    if(d===n)return 'done';
    if(t.status==='done')return d?'doing':'todo';
    if(t.status==='todo'&&d)return 'doing';
    return null;
  }
  function changeSubs(t,mutate,after){
    var patch={subtasks:t.subtasks?{}:fullMap(t)};
    mutate(patch.subtasks);
    var st=statusAfter(t,after);
    if(st&&st!==t.status){patch.status=st;if(st==='done')toast('サブタスクがすべて完了したので、TODOを完了にしました')}
    updTodo(t.id,patch);
  }
  function toggleSub(t,sid,done){
    var after=subsOf(t).map(function(s){return s.id===sid?Object.assign({},s,{done:done}):s});
    changeSubs(t,function(m){m[sid]=Object.assign(m[sid]||{},{done:done,by:done?state.me.id:null,doneAt:done?Date.now():null})},after);
  }
  function addSub(t,text){
    var subs=subsOf(t), max=subs.reduce(function(m,s){return Math.max(m,s.order||0)},0);
    var sid='s'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
    var after=subs.concat([{id:sid,text:text,done:false,order:max+1}]);
    var patch={subtasks:t.subtasks?{}:fullMap(t)};
    patch.subtasks[sid]={text:text,done:false,order:max+1};
    if(t.status==='done')patch.status='doing';
    updTodo(t.id,patch);
  }
  function delSub(t,sid){
    var after=subsOf(t).filter(function(s){return s.id!==sid});
    changeSubs(t,function(m){m[sid]=Object.assign(m[sid]||{},{deleted:true})},after);
  }

  function visible(){
    return state.todos.filter(function(t){
      if(state.view==='open'&&t.status==='done'&&!state.open[t.id])return false;
      if(state.who==='a'&&t.who==='b')return false;
      if(state.who==='b'&&t.who==='a')return false;
      if(state.who==='both'&&t.who!=='both')return false;
      if(state.cat!=='all'&&t.cat!==state.cat)return false;
      return true;
    });
  }
  function chipWho(w){return '<span class="chip '+w+'">'+esc(whoName(w))+'</span>'}
  function pendingFor(id){return state.requests.filter(function(r){return r.status==='pending'&&r.todoId===id}).length}

  /* ---- Claude panel (ask now via `sample`, or file a request that the Claude session answers with web research) ---- */
  function chatOf(key){return state.chats[key]||(state.chats[key]={turns:[],live:'',busy:false,err:'',ctl:null})}
  function panelHTML(key){
    var chat=chatOf(key), draft=state.drafts[key]||'';
    var reqs=state.requests.filter(function(r){return key==='g'?!r.todoId:r.todoId===key}).sort(function(a,b){return (b.at||0)-(a.at||0)});
    var h='<div class="claude" data-key="'+esc(key)+'"><h3>Claudeに相談・依頼</h3><div class="quick">'
      +QUICK.map(function(q){return '<button type="button" data-act="quick" data-text="'+esc(q)+'">'+esc(q)+'</button>'}).join('')+'</div>'
      +'<textarea class="ctext" placeholder="例: 小田原市の最新の申込期間を調べて / この手順で足りない点はある?">'+esc(draft)+'</textarea>'
      +'<div class="edit"><button type="button" class="btn primary small" data-act="ask"'+(chat.busy||!sample?' disabled':'')+'>すぐに聞く</button>'
      +'<button type="button" class="btn small" data-act="req">調べてもらう(依頼)</button>'
      +(chat.busy?'<button type="button" class="btn small" data-act="stop">停止</button>':'')
      +(chat.turns.length&&!chat.busy?'<button type="button" class="btn small" data-act="reset">会話をリセット</button>':'')+'</div>'
      +'<p class="hint">「すぐに聞く」はWebを検索せず、この画面の情報と一般知識で答えます(あなたのClaude利用枠を使います)。最新の制度・期限・金額の調査や、サブタスクの追加は「調べてもらう」で依頼してください。'+(sample?'':'(この環境では「すぐに聞く」は使えません)')+'</p>';
    chat.turns.forEach(function(t,i){
      h+='<div class="bub '+(t.role==='user'?'u':'c')+'"><small>'+(t.role==='user'?'あなた':'Claude(Web検索なし・要確認)')+'</small>'+esc(t.content)+'</div>';
      if(t.role==='assistant'&&key!=='g'&&i===chat.turns.length-1&&!chat.busy)h+='<div class="edit"><button type="button" class="btn small" data-act="append">この回答をメモに追記</button></div>';
    });
    if(chat.busy)h+='<div class="bub c live" data-live="'+esc(key)+'"><small>Claude</small>'+(chat.live?esc(chat.live):'考え中…')+'</div>';
    if(chat.err)h+='<p class="caution">'+esc(chat.err)+'</p>';
    if(reqs.length){
      h+='<h3 style="margin-top:4px">依頼と回答</h3>'+reqs.map(function(r){
        var done=r.status==='done';
        return '<div class="req"><div class="meta"><span class="chip '+(done?'ok':'warn')+'">'+(done?'回答済み':'依頼中')+'</span><span class="chip">'+esc(nameOf(r.by)||'')+' '+esc(stamp(r.at))+'</span></div>'
          +'<div class="q">'+esc(r.text)+'</div>'
          +(done&&r.reply?'<div class="a">'+esc(r.reply)+'<small style="display:block;color:var(--muted)">Claude '+esc(stamp(r.repliedAt))+'</small></div>':'')
          +(!done?'<small class="hint">Claudeのセッションで「依頼を処理して」と伝えると、回答がここに入ります。</small>':'')+'</div>';
      }).join('');
    }
    return h+'</div>';
  }

  function contextFor(key){
    var s=state.settings;
    var base='あなたは、夫婦の引っ越しTODOを手伝うアシスタントです。前提: 兵庫県宝塚市の持ち家を売却し、神奈川県小田原市(酒匂1丁目周辺が候補)の持ち家を購入する県外転居。りそな銀行の住みかえプラン(先行購入、旧居の売却に約1年の猶予を予定)。引っ越し予定日は'+s.moveDate+(s.moveDateTentative?'(仮)':'')+'。子ども(保育園・幼稚園)、ペット、車・バイクあり。夫婦2人で使う。\n'
      +'ルール: 日本語で、短く具体的に答える。あなたはWebを検索できないので、制度・期限・金額は断定せず、確認先(公式サイトや窓口)を示す。調査が必要な内容は、画面の「調べてもらう(依頼)」を使うよう案内する。\n';
    if(key==='g'){
      var td=today();
      var lines=state.todos.filter(function(t){return t.status!=='done'}).sort(function(a,b){return dueOf(a)-dueOf(b)}).slice(0,70).map(function(t){var sb=subsOf(t);return '- '+jp(dueOf(t))+' '+whoName(t.who)+' '+t.title+(sb.length?' ('+sb.filter(function(x){return x.done}).length+'/'+sb.length+')':'')});
      return base+'今日は'+fmt(td)+'。未完了のTODO(期限順):\n'+lines.join('\n');
    }
    var t=todoById(key); if(!t)return base;
    var info={title:t.title,category:t.cat,assignee:whoName(t.who),due:fmt(dueOf(t)),status:t.status,note:t.note||'',subtasks:subsOf(t).map(function(x){return (x.done?'[x] ':'[ ] ')+x.text}),research:t.research||null};
    return base+'質問の対象のTODO(JSON):\n'+JSON.stringify(info).slice(0,9000);
  }
  function ask(key){
    var chat=chatOf(key), text=(state.drafts[key]||'').trim();
    if(!text||chat.busy)return;
    if(!sample){toast('この環境では「すぐに聞く」を使えません');return}
    chat.turns.push({role:'user',content:text}); chat.busy=true; chat.live=''; chat.err=''; state.drafts[key]='';
    var ctl=new AbortController(); chat.ctl=ctl;
    var input=[{role:'user',content:contextFor(key)}].concat(chat.turns.slice(-8));
    render();
    sample(input,{cache:false,signal:ctl.signal,onText:function(u){
      chat.live=u.text;
      var el=document.querySelector('[data-live="'+key+'"]');
      if(el){el.innerHTML='<small>Claude</small>';el.appendChild(document.createTextNode(u.text))}
    }}).then(function(r){
      chat.turns.push({role:'assistant',content:r.text+(r.truncated?'\n(長いため途中で切れました)':'')});
    }).catch(function(e){
      if(e&&e.text)chat.turns.push({role:'assistant',content:e.text+'\n(途中で止まりました)'});
      if(!e||e.code!=='cancelled')chat.err=CERR[e&&e.code]||'回答を取得できませんでした。もう一度お試しください。';
    }).then(function(){chat.busy=false;chat.live='';chat.ctl=null;render()});
  }
  function request(key){
    var text=(state.drafts[key]||'').trim(); if(!text)return;
    state.drafts[key]='';
    var data={todoId:key==='g'?null:key,text:text,by:state.me.id,at:Date.now(),status:'pending',reply:'',repliedAt:null};
    write('requests/new',function(){return reqCol.add(data)}).then(function(){toast('依頼を保存しました。Claudeのセッションで「依頼を処理して」と伝えてください')});
    render();
  }

  function renderItem(t,td){
    var d=dueOf(t), done=t.status==='done', over=!done&&d<td, left=d-td, r=t.research;
    var subs=subsOf(t), sd=subs.filter(function(s){return s.done}).length, pend=pendingFor(t.id);
    var dueChip='<span class="chip '+(over?'bad':(!done&&left<=7?'warn':''))+'">'+jp(d)+(over?'・'+(-left)+'日超過':(!done&&left>=0&&left<=7?'・あと'+left+'日':''))+'</span>';
    var chips=dueChip+chipWho(t.who)+'<span class="chip">'+esc(t.cat)+'</span>'
      +(subs.length&&!done?'<span class="chip '+(sd?'ok':'')+'">手順 '+sd+'/'+subs.length+'</span>':'')
      +(t.priority&&!done?'<span class="chip pri">優先</span>':'')
      +(t.status==='doing'?'<span class="chip warn">進行中</span>':'')
      +(pend?'<span class="chip warn">Claudeに依頼中</span>':'')
      +(r?'<span class="chip ok">下調べ済</span>':'');
    var h='<div class="item'+(done?' done':'')+(over?' over':'')+'" data-id="'+esc(t.id)+'">'
      +'<div class="row"><input type="checkbox" class="chk" data-act="toggle" aria-label="完了にする"'+(done?' checked':'')+'>'
      +'<button type="button" class="main" data-act="open" aria-expanded="'+(!!state.open[t.id])+'"><span class="title">'+esc(t.title)+'</span><span class="meta">'+chips+'</span></button></div>';
    if(state.open[t.id]){
      h+='<div class="detail"><div class="edit">'
        +'<label>担当<select data-act="who">'+['a','b','both'].map(function(w){return '<option value="'+w+'"'+(t.who===w?' selected':'')+'>'+esc(whoName(w))+'</option>'}).join('')+'</select></label>'
        +'<label>期限<input type="date" data-act="due" value="'+fmt(d)+'"></label>'
        +'<label>状態<select data-act="status">'+[['todo','未着手'],['doing','進行中'],['done','完了']].map(function(s){return '<option value="'+s[0]+'"'+(t.status===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></label>'
        +(t.due&&t.offset!=null?'<button type="button" class="btn small" data-act="unfix" style="align-self:flex-end">引っ越し日に連動</button>':'')
        +'</div>';
      /* subtasks */
      h+='<div class="subs"><h3>サブタスク'+(subs.length?' '+sd+'/'+subs.length:'')+(subs.length?'<span class="bar"><i style="width:'+Math.round(sd/subs.length*100)+'%"></i></span>':'')+'</h3>';
      if(!subs.length)h+='<p class="hint">サブタスクはまだありません。下から追加できます。</p>';
      subs.forEach(function(s){
        var who=s.done&&s.by?nameOf(s.by):'';
        h+='<div class="sub'+(s.done?' done':'')+'" data-sid="'+esc(s.id)+'"><input type="checkbox" data-act="subtoggle" aria-label="完了にする"'+(s.done?' checked':'')+'>'
          +'<span class="txt">'+esc(s.text)+(s.done&&(who||s.doneAt)?'<small>'+esc(who)+(s.doneAt?' '+esc(stamp(s.doneAt)):'')+'</small>':'')+'</span>'
          +'<button type="button" class="x" data-act="subdel" aria-label="削除">×</button></div>';
      });
      h+='<div class="subadd"><input type="text" class="subnew" placeholder="サブタスクを追加" aria-label="サブタスクを追加"><button type="button" class="btn small" data-act="subadd">追加</button></div>'
        +'<p class="hint">すべてチェックすると、このTODOは自動で完了になります。</p></div>';
      if(r){
        h+='<div class="research"><h3>下調べ('+esc(r.checkedAt||'')+')</h3>';
        if(r.summary)h+='<p>'+esc(r.summary)+'</p>';
        if(r.docs&&r.docs.length||r.cost){h+='<dl>';
          if(r.docs&&r.docs.length)h+='<dt>必要書類</dt><dd>'+r.docs.map(esc).join('、')+'</dd>';
          if(r.cost)h+='<dt>費用</dt><dd>'+esc(r.cost)+'</dd>';
          h+='</dl>';}
        if(r.caution)h+='<p class="caution">要確認: '+esc(r.caution)+'</p>';
        if(r.links&&r.links.length)h+='<p>'+r.links.map(function(l){return '<a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.t)+'</a>'}).join(' / ')+'</p>';
        h+='</div>';
      }else{
        h+='<div class="pending">下調べはまだありません。下の「Claudeに相談・依頼」から調査を頼めます。</div>';
      }
      h+=panelHTML(t.id);
      h+='<label style="font-size:12px;color:var(--muted)">メモ・進捗(夫婦で共有)<textarea data-act="note" placeholder="進捗や連絡先など">'+esc(t.note||'')+'</textarea></label>'
        +'<div class="edit"><button type="button" class="btn small danger" data-act="del">'+(state.confirmDel===t.id?'本当に削除する':'このTODOを削除')+'</button></div></div>';
    }
    return h+'</div>';
  }

  function inField(){var ae=document.activeElement;return ae&&(($('list').contains(ae)||$('gpanel').contains(ae)))&&/^(TEXTAREA|INPUT)$/.test(ae.tagName)&&ae.type!=='checkbox'}

  function render(){
    if(!state.ready)return;
    if(inField()){pendingRender=true;return}
    pendingRender=false;
    var td=today(), all=state.todos, mv=parse(state.settings.moveDate), days=mv-td;
    $('count').innerHTML=days>=0?'<span>引っ越しまで</span><br><b>'+days+'</b><span> 日</span><br><span>'+jp(mv)+' '+esc(state.settings.moveDate.slice(0,4))+(state.settings.moveDateTentative?'(仮)':'')+'</span>'
      :'<span>引っ越しから</span><br><b>'+(-days)+'</b><span> 日</span>';
    var done=all.filter(function(t){return t.status==='done'}).length;
    var overN=all.filter(function(t){return t.status!=='done'&&dueOf(t)<td}).length;
    var weekN=all.filter(function(t){var d=dueOf(t);return t.status!=='done'&&d>=td&&d<=td+7}).length;
    var pendN=state.requests.filter(function(r){return r.status==='pending'}).length;
    $('summary').innerHTML='<div class="stat"><small>完了</small><b>'+done+'</b><small> / '+all.length+'</small><div class="bar"><i style="width:'+(all.length?Math.round(done/all.length*100):0)+'%"></i></div></div>'
      +'<div class="stat '+(overN?'bad':'')+'"><small>期限超過</small><b>'+overN+'</b><small> 件</small></div>'
      +'<div class="stat"><small>7日以内</small><b>'+weekN+'</b><small> 件</small></div>'
      +'<div class="stat ask"><small>Claudeに依頼中</small><b>'+pendN+'</b><small> 件</small></div>';
    $('banner').innerHTML=pendN?'<div class="banner">Claudeへの依頼が'+pendN+'件あります。Claudeのセッションで「依頼を処理して」と伝えると、調べた結果が各TODOに入ります。</div>':'';
    $('gpanel').innerHTML='<button type="button" class="btn" data-act="gtoggle" style="justify-self:start" aria-expanded="'+state.gopen+'">'+(state.gopen?'▾':'▸')+' Claudeに相談・依頼(全体)</button>'+(state.gopen?panelHTML('g'):'');

    var whoBtns=[['all','全員'],['a',state.settings.nameA],['b',state.settings.nameB],['both','両方']];
    $('whoSeg').innerHTML=whoBtns.map(function(b){return '<button type="button" data-w="'+b[0]+'" aria-pressed="'+(state.who===b[0])+'">'+esc(b[1])+'</button>'}).join('');
    var cv=state.cat;
    $('catSel').innerHTML='<option value="all">すべてのカテゴリ</option>'+CATS.map(function(c){return '<option value="'+esc(c)+'"'+(cv===c?' selected':'')+'>'+esc(c)+'</option>'}).join('');
    Array.prototype.forEach.call($('viewSeg').children,function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===state.view))});
    var aw=$('addWho'), av=aw.value||'both';
    aw.innerHTML=['a','b','both'].map(function(w){return '<option value="'+w+'"'+(av===w?' selected':'')+'>'+esc(whoName(w))+'</option>'}).join('');

    var vis=visible().slice().sort(function(a,b){return dueOf(a)-dueOf(b)||(a.order||0)-(b.order||0)});
    if(!all.length){$('list').innerHTML='<div class="empty">TODOがまだありません。下のフォームから追加できます。</div>';return}
    if(!vis.length){$('list').innerHTML='<div class="empty">この条件に合うTODOはありません。</div>';return}
    var groups=[['over','期限超過',[]],['w','7日以内',[]],['m','30日以内',[]],['l','それ以降',[]],['d','完了',[]]];
    vis.forEach(function(t){
      var d=dueOf(t);
      if(t.status==='done')groups[4][2].push(t);
      else if(d<td)groups[0][2].push(t);
      else if(d<=td+7)groups[1][2].push(t);
      else if(d<=td+30)groups[2][2].push(t);
      else groups[3][2].push(t);
    });
    $('list').innerHTML=groups.filter(function(g){return g[2].length}).map(function(g){
      return '<section class="grp '+(g[0]==='over'?'over':'')+'"><h2>'+g[1]+'<em>'+g[2].length+'</em></h2>'+g[2].map(function(t){return renderItem(t,td)}).join('')+'</section>';
    }).join('');
  }

  function renderSettings(){
    var s=state.settings, el=$('settings');
    el.hidden=!state.editingSettings;
    if(!state.editingSettings)return;
    el.innerHTML='<div class="edit"><label>引っ越し日<input type="date" id="sMove" value="'+esc(s.moveDate)+'"></label>'
      +'<label>確定?<select id="sTent"><option value="1"'+(s.moveDateTentative?' selected':'')+'>仮</option><option value="0"'+(!s.moveDateTentative?' selected':'')+'>確定</option></select></label>'
      +'<label>1人目の呼び名<input type="text" id="sA" value="'+esc(s.nameA)+'" size="8"></label>'
      +'<label>2人目の呼び名<input type="text" id="sB" value="'+esc(s.nameB)+'" size="8"></label>'
      +'<button type="button" class="btn primary" id="sSave" style="align-self:flex-end">保存</button></div>'
      +'<p class="route" style="margin-top:8px">引っ越し日を変えると、日付を固定していないTODOの期限が連動して動きます。</p>';
  }

  /* ---- events ---- */
  function claudeClick(e){
    var panel=e.target.closest('.claude'); if(!panel)return false;
    var b=e.target.closest('[data-act]'); if(!b)return true;
    var key=panel.getAttribute('data-key'), a=b.getAttribute('data-act');
    if(a==='quick'){var q=b.getAttribute('data-text');var cur=state.drafts[key]||'';state.drafts[key]=cur?cur+'\n'+q:q;pendingRender=false;render()}
    else if(a==='ask'){state.drafts[key]=panel.querySelector('.ctext').value;ask(key)}
    else if(a==='req'){state.drafts[key]=panel.querySelector('.ctext').value;request(key)}
    else if(a==='stop'){var c=chatOf(key);if(c.ctl)c.ctl.abort()}
    else if(a==='reset'){state.chats[key]=null;delete state.chats[key];render()}
    else if(a==='append'){
      var t=todoById(key), c2=chatOf(key), last=c2.turns[c2.turns.length-1];
      if(t&&last&&last.role==='assistant'){
        var note=(t.note?t.note+'\n\n':'')+'[Claude '+stamp(Date.now())+']\n'+last.content;
        updTodo(key,{note:note});toast('メモに追記しました');
      }
    }
    return true;
  }
  function onClick(e){
    if(claudeClick(e))return;
    var g=e.target.closest('[data-act="gtoggle"]');
    if(g){state.gopen=!state.gopen;render();return}
    var item=e.target.closest('.item'); if(!item)return;
    var id=item.getAttribute('data-id'), act=e.target.closest('[data-act]');
    if(!act)return; var a=act.getAttribute('data-act'), t=todoById(id);
    if(a==='open'){state.open[id]=!state.open[id];state.confirmDel=null;render()}
    else if(a==='unfix'){updTodo(id,{due:null})}
    else if(a==='del'){
      if(state.confirmDel===id){state.confirmDel=null;write('todos/'+id,function(){return todosCol.doc(id).delete()})}
      else{state.confirmDel=id;render()}
    }else if(a==='subadd'&&t){
      var inp=item.querySelector('.subnew'), v=inp.value.trim();
      if(v){inp.value='';addSub(t,v)}
    }else if(a==='subdel'&&t){delSub(t,act.closest('.sub').getAttribute('data-sid'))}
  }
  $('list').addEventListener('click',onClick);
  $('gpanel').addEventListener('click',onClick);
  $('list').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.classList.contains('subnew')){
      e.preventDefault();var item=e.target.closest('.item'),t=todoById(item.getAttribute('data-id')),v=e.target.value.trim();
      if(t&&v){e.target.value='';addSub(t,v)}
    }
  });
  function onInput(e){
    if(!e.target.classList.contains('ctext'))return;
    var p=e.target.closest('.claude'); if(p)state.drafts[p.getAttribute('data-key')]=e.target.value;
  }
  $('list').addEventListener('input',onInput);
  $('gpanel').addEventListener('input',onInput);
  $('list').addEventListener('change',function(e){
    var item=e.target.closest('.item'); if(!item)return;
    var id=item.getAttribute('data-id'), a=e.target.getAttribute('data-act'), v=e.target.value, t=todoById(id);
    if(a==='toggle')updTodo(id,{status:e.target.checked?'done':'todo'});
    else if(a==='who')updTodo(id,{who:v});
    else if(a==='status')updTodo(id,{status:v});
    else if(a==='due'){if(v)updTodo(id,{due:v})}
    else if(a==='note')updTodo(id,{note:v});
    else if(a==='subtoggle'&&t)toggleSub(t,e.target.closest('.sub').getAttribute('data-sid'),e.target.checked);
  });
  function flush(){setTimeout(function(){if(pendingRender)render()},50)}
  $('list').addEventListener('focusout',flush);
  $('gpanel').addEventListener('focusout',flush);
  $('whoSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.who=b.getAttribute('data-w');render()});
  $('viewSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.view=b.getAttribute('data-v');render()});
  $('catSel').addEventListener('change',function(e){state.cat=e.target.value;render()});
  $('settingsBtn').addEventListener('click',function(){state.editingSettings=!state.editingSettings;renderSettings()});
  $('settings').addEventListener('click',function(e){
    if(e.target.id!=='sSave')return;
    var m=$('sMove').value; if(!m){toast('引っ越し日を入力してください');return}
    var s={moveDate:m,moveDateTentative:$('sTent').value==='1',nameA:$('sA').value.trim()||'夫',nameB:$('sB').value.trim()||'妻'};
    write('settings/main',function(){return settingsDoc.set(s)}).then(function(){state.editingSettings=false;renderSettings();toast('保存しました')});
  });
  $('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var title=$('addTitle').value.trim(); if(!title)return;
    var due=$('addDue').value||null;
    var max=state.todos.reduce(function(m,t){return Math.max(m,t.order||0)},0);
    var data={title:title,cat:$('addCat').value,who:$('addWho').value,offset:due?null:-30,due:due,priority:false,status:'todo',note:'',research:null,order:max+1};
    write('todos/new',function(){return todosCol.add(data)}).then(function(){$('addTitle').value='';$('addDue').value='';toast('追加しました')});
  });
  $('addCat').innerHTML=CATS.map(function(c){return '<option>'+esc(c)+'</option>'}).join('');

  /* names of people who ticked subtasks or filed requests */
  function resolveNames(){
    if(!userCap||!userCap.profiles)return;
    var ids={};
    state.todos.forEach(function(t){var m=t.subtasks;if(m)Object.keys(m).forEach(function(k){if(m[k]&&m[k].by)ids[m[k].by]=1})});
    state.requests.forEach(function(r){if(r.by)ids[r.by]=1});
    var list=Object.keys(ids).filter(function(i){return !state.names[i]});
    var key=list.join(',');
    if(!list.length||key===nameKey)return;
    nameKey=key;
    userCap.profiles(list).then(function(ps){
      var changed=false;
      list.forEach(function(i){if(ps[i]&&ps[i].name&&state.names[i]!==ps[i].name){state.names[i]=ps[i].name;changed=true}});
      if(changed)render();
    }).catch(function(){});
  }

  function boot(){
    if(!window.claude||!claude.use){$('list').innerHTML='<div class="empty">共有データを読み込めません。claude.aiで開き直してください。</div>';return}
    claude.use('user').then(function(u){
      userCap=u;
      if(u&&u.me)return u.me().then(function(m){state.me={id:m.id,name:m.name||''}});
    }).catch(function(){}).then(function(){return claude.use('sample')}).then(function(s){sample=s||null;render()}).catch(function(){});
    claude.use('db').then(function(d){
      if(!d){$('list').innerHTML='<div class="empty">共有データを読み込めません。サインインしてから開き直してください。</div>';return}
      db=d; todosCol=db.collection('todos'); reqCol=db.collection('requests'); settingsDoc=db.doc('settings/main');
      settingsDoc.onSnapshot(function(snap){
        if(snap.exists){var s=snap.data();state.settings={moveDate:s.moveDate||'2027-03-20',moveDateTentative:!!s.moveDateTentative,nameA:s.nameA||'夫',nameB:s.nameB||'妻'}}
        state.ready=true; render(); renderSettings();
      },function(){});
      todosCol.onSnapshot(function(snap){
        state.todos=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
        state.ready=true; render(); resolveNames();
      },function(){$('list').innerHTML='<div class="empty">読み込みに失敗しました。ページを開き直してください。</div>'});
      reqCol.onSnapshot(function(snap){
        state.requests=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
        render(); resolveNames();
      },function(){});
    });
  }
  boot();
})();
</script>
