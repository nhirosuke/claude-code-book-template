<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ブロック崩し</title>
<style>
  body {
    margin: 0;
    padding: 0 8px;
    overscroll-behavior: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #222;
    color: #fff;
    font-family: sans-serif;
  }
  canvas {
    background: #000;
    border: 2px solid #fff;
    margin-top: 20px;
    width: 100%;
    max-width: 480px;
    height: auto;
    box-sizing: border-box;
    touch-action: none;
  }
  #info {
    margin-top: 10px;
    font-size: 18px;
  }
</style>
</head>
<body>
  <h1>ブロック崩し</h1>
  <div id="info">スコア: <span id="score">0</span></div>
  <canvas id="game" width="480" height="320"></canvas>
  <script src="main.js"></script>
</body>
</html>
